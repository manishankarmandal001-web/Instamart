<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Growth chart line behind the T -->
  <path d="M 96 350 Q 180 320 240 270 T 416 160" fill="none" stroke="url(#glowGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="2 1" opacity="0.5" />

  <!-- Monogram T for Trrop -->
  <g filter="url(#shadow)">
    <!-- Top Bar of T -->
    <path d="M 120 148 C 120 136 130 126 142 126 L 370 126 C 382 126 392 136 392 148 L 392 192 C 392 204 382 214 370 214 L 296 214 L 296 376 C 296 388 286 398 274 398 L 238 398 C 226 398 216 388 216 376 L 216 214 L 142 214 C 130 214 120 204 120 192 Z" fill="url(#accentGrad)" />

    <!-- Upward Trend Arrow Sparkle on the right of T -->
    <circle cx="416" cy="160" r="18" fill="#10b981" />
    <path d="M 408 160 L 424 160 M 416 152 L 416 168" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
